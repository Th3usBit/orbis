# Build and publish the demo site.
#
# The repository contains no data: calendar.json and the globe geometry are
# generated here, at deploy time, and uploaded as the Pages artefact. Nothing
# is ever committed back, so a clone of this repo stays free of snapshots.
#
# Forks: this runs only after you enable Pages (Settings -> Pages -> Source:
# GitHub Actions). Until then it is skipped, not failed.
#
# This workflow is the only thing that refreshes the data. The site has no
# backend: calendar.json is baked into the artefact, so the published calendar
# is exactly as old as the last deploy. Two consequences worth knowing:
#
#   * GitHub disables a scheduled workflow in a public repository after 60 days
#     with no activity. Nothing then rebuilds, and because the collector only
#     looks 21 days ahead, the calendar empties out about three weeks later
#     while the site keeps serving happily. Re-enable it from the Actions tab,
#     or with `gh workflow enable "Deploy to Pages"`.
#   * A scheduled run is not a promise, and the shortfall is larger than the
#     docs suggest. Measured on this repository: an earlier workflow asking for
#     hourly runs got four in a day, and this one asking for four got two. The
#     runs that do arrive are not late-but-queued -- created_at equals
#     run_started_at -- so GitHub is dropping the firings it will not take
#     rather than backing them up. The cron below therefore asks for eight a
#     day to land roughly four, sits at minute 17 to miss the top-of-hour rush,
#     and the whole scheme is best-effort: what actually keeps the site honest
#     is that every build is a full rebuild, so one that lands replaces
#     everything a dropped one would have done. Missing one is harmless -- the
#     window is three weeks deep -- but missing every one is the case above.

name: Deploy to Pages

on:
  push:
    branches: [main]
  # Keep the published demo current: the artefact is rebuilt from scratch.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the globe geometry
        run: python scripts/build_geometry.py

      - name: Collect the calendar
        run: python scripts/fetch.py

      # GitHub Pages serves CSS and JS with max-age=600, so a viewer who
      # visited in the last ten minutes gets the old stylesheet against the new
      # markup -- a layout that looks broken and is not. Stamping the commit
      # onto the asset links makes each deploy a new URL, which no cache can
      # confuse with the last one. Nothing is renamed on disk: the query string
      # is enough, and `start.sh` keeps serving the plain paths offline.
      - name: Version the asset links
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s|href=\"css/orbis.css\"|href=\"css/orbis.css?v=$V\"|" index.html
          sed -i "s|href=\"vendor/fonts.css\"|href=\"vendor/fonts.css?v=$V\"|" index.html
          sed -i "s|src=\"js/main.js\"|src=\"js/main.js?v=$V\"|" index.html
          grep -o 'v=[a-f0-9]\{8\}' index.html | head -3

      - uses: actions/configure-pages@v5

      # The repository root is the site: index.html, css/, js/, assets/, data/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
