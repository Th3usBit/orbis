# Build and publish the demo site.
#
# The repository contains no data: calendar.json and the globe geometry are
# generated here, at deploy time, and uploaded as the Pages artefact. Nothing
# is ever committed back, so a clone of this repo stays free of snapshots.
#
# Forks: this runs only after you enable Pages (Settings -> Pages -> Source:
# GitHub Actions). Until then it is skipped, not failed.

name: Deploy to Pages

on:
  push:
    branches: [main]
  # Keep the published demo current: the artefact is rebuilt from scratch.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the globe geometry
        run: python scripts/build_geometry.py

      - name: Collect the calendar
        run: python scripts/fetch.py

      # GitHub Pages serves CSS and JS with max-age=600, so a viewer who
      # visited in the last ten minutes gets the old stylesheet against the new
      # markup -- a layout that looks broken and is not. Stamping the commit
      # onto the asset links makes each deploy a new URL, which no cache can
      # confuse with the last one. Nothing is renamed on disk: the query string
      # is enough, and `start.sh` keeps serving the plain paths offline.
      - name: Version the asset links
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s|href=\"css/orbis.css\"|href=\"css/orbis.css?v=$V\"|" index.html
          sed -i "s|href=\"vendor/fonts.css\"|href=\"vendor/fonts.css?v=$V\"|" index.html
          sed -i "s|src=\"js/main.js\"|src=\"js/main.js?v=$V\"|" index.html
          grep -o 'v=[a-f0-9]\{8\}' index.html | head -3

      - uses: actions/configure-pages@v5

      # The repository root is the site: index.html, css/, js/, assets/, data/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
