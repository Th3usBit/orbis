name: Update calendar

# The site is static, so the data has to be rebuilt on a schedule rather than
# fetched by the browser. Hourly is enough: economic calendars are published
# days in advance and only the actual/revised figures move intraday.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect the calendar
        run: python scripts/fetch.py

      - name: Commit when something changed
        run: |
          git config user.name  'orbis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ -z "$(git status --porcelain data/calendar.json)" ]; then
            echo 'No change in the calendar.'
            exit 0
          fi

          summary=$(python -c "import json;d=json.load(open('data/calendar.json'));s=d['stats'];print(f\"{s['total']} events, {s['countries']} countries\")")
          git add data/calendar.json
          git commit -m "data: refresh calendar ($summary)"
          git push
