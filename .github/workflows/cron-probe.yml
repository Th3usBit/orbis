# TEMPORARY -- scheduler probe. Delete after the run.
#
# Proves that this repository's `schedule` trigger actually fires, rather than
# only being configured. Touches nothing: no data, no deploy, no Pages.

name: Cron probe (temporary)

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Say when the scheduler fired
        run: |
          echo "scheduler fired at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "event: ${{ github.event_name }}"
