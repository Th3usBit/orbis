# Verify that a fresh clone builds and runs, on every platform we claim to
# support. This is the check that matters for an orbis fork: nothing is
# cached, nothing is committed, everything is built from source.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fresh clone on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Jobs finish in well under a minute; a hung urlopen would otherwise sit
    # on the runner until the six-hour default.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No requirements.txt on purpose: the collector is standard library only.
      # If this step ever needs a pip install, that promise has been broken.
      - name: Build the globe geometry
        run: python scripts/build_geometry.py

      # --allow-partial here, but never in pages.yml. CI asks "does a fresh
      # clone build and run"; whether TradingView is up this afternoon is not
      # its question. Without it a contributor's CSS-only PR goes red because
      # a third party had an outage, and a real break becomes indistinguishable
      # from a bad afternoon. Publishing is where the strict guard belongs.
      - name: Collect the calendar
        run: python scripts/fetch.py --allow-partial

      # lts/* rather than a pinned major: Node 20 went end-of-life in April
      # 2026 and is being removed from the runners, and the tests use nothing
      # newer than `node:` core imports and top-level await. Tracking LTS means
      # this line does not need revisiting at the next end-of-life.
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Smoke-test the state layer
        run: node tests/store.test.mjs .

      # safeUrl is the second layer between a third-party feed and an href, and
      # formatValue decides what a number looks like in every row. Neither had
      # a test until IMPACT_COLORS moved out of globe.js and stopped dragging
      # three into a plain node import.
      - name: Check the formatting and the astronomy
        run: node tests/format.test.mjs .

      - name: Check the translation tables
        run: node tests/i18n.test.mjs .

      # Reconciliation fails quietly: a bad match publishes a plausible row
      # carrying another release's numbers. These assert the output's shape.
      - name: Check the reconciled dataset
        run: node tests/merge.test.mjs .

      # Guards the offline promise: fails if anything reaches for a CDN again.
      - name: Check the page depends on nothing remote
        run: node tests/offline.test.mjs .

  interface:
    name: The interface in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The questions this suite asks -- is the text readable, is the control
    # reachable, does the globe get a GL context -- cannot be answered from the
    # stylesheet, and it was running nowhere: 37 checks that only fired if a
    # contributor remembered them by hand. Linux only, because the answers are
    # about CSS and the DOM rather than about the platform, and one browser is
    # enough to catch a regression.
    #
    # Playwright stays a CI tool and never enters the repository: no
    # package.json, no lockfile, nothing committed. `npx --yes` fetches it into
    # the runner's cache for this job alone, exactly the way setup-node and
    # setup-python are fetched. The site still needs no package manager.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Build the globe geometry
        run: python scripts/build_geometry.py

      - name: Collect the calendar
        run: python scripts/fetch.py --allow-partial

      # Installed outside the checkout, so no package.json or lockfile ever
      # appears next to the site. `npx playwright` alone would not do: it
      # leaves the package in npx's cache, where a bare `import('playwright')`
      # from this directory cannot reach it -- the suite would find nothing,
      # print SKIP and exit 0, which reads as a pass.
      - name: Install a browser
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      # index.mjs, not index.js: the CommonJS entry resolves but exposes no
      # named `chromium` export, so the suite would skip while looking healthy.
      # The suite starts scripts/serve.py on its own.
      - name: Check the interface
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pw/node_modules/playwright/index.mjs
        run: node tests/ui.test.mjs .

  oldest-python:
    name: Python 3.9, the version the README promises
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # The matrix above runs a current Python, which would never notice a
      # 3.10-only construct creeping in. One job on the declared minimum keeps
      # "Python 3.9+" an assertion rather than an aspiration. Linux only: the
      # collector touches no platform API, so the OS matrix above covers that
      # axis and running both here would triple the bill for nothing.
      - name: Collect the calendar
        run: python scripts/fetch.py --allow-partial

      - name: Build the globe geometry
        run: python scripts/build_geometry.py
