# Verify that a fresh clone builds and runs, on every platform we claim to
# support. This is the check that matters for an orbis fork: nothing is
# cached, nothing is committed, everything is built from source.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fresh clone on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No requirements.txt on purpose: the collector is standard library only.
      # If this step ever needs a pip install, that promise has been broken.
      - name: Build the globe geometry
        run: python scripts/build_geometry.py

      - name: Collect the calendar
        run: python scripts/fetch.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Smoke-test the state layer
        run: node tests/store.test.mjs .

      - name: Check the translation tables
        run: node tests/i18n.test.mjs .

      # Reconciliation fails quietly: a bad match publishes a plausible row
      # carrying another release's numbers. These assert the output's shape.
      - name: Check the reconciled dataset
        run: node tests/merge.test.mjs .

      # Guards the offline promise: fails if anything reaches for a CDN again.
      - name: Check the page depends on nothing remote
        run: node tests/offline.test.mjs .

  oldest-python:
    name: Python 3.9, the version the README promises
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # The matrix above runs a current Python, which would never notice a
      # 3.10-only construct creeping in. One job on the declared minimum keeps
      # "Python 3.9+" an assertion rather than an aspiration. Linux only: the
      # collector touches no platform API, so the OS matrix above covers that
      # axis and running both here would triple the bill for nothing.
      - name: Collect the calendar
        run: python scripts/fetch.py

      - name: Build the globe geometry
        run: python scripts/build_geometry.py
