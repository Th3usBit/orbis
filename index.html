<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>orbis — the world economic calendar on a globe</title>
<meta name="description" content="Every scheduled economic release, central bank decision and market holiday on Earth, plotted on a live 3D globe. Open source, no API keys, no backend.">
<meta name="theme-color" content="#05070c">

<meta property="og:title" content="orbis — the world economic calendar on a globe">
<meta property="og:description" content="Every scheduled economic release, central bank decision and market holiday on Earth, on a live 3D globe.">
<meta property="og:type" content="website">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%234da3ff' stroke-width='2'/><ellipse cx='16' cy='16' rx='5.5' ry='13' fill='none' stroke='%234da3ff' stroke-width='1.4' opacity='.7'/><path d='M3.6 12h24.8M3.6 20h24.8' stroke='%234da3ff' stroke-width='1.4' opacity='.7'/></svg>">
<!-- Everything the page needs is served from this repository: no CDN, no
     font service, no request leaves the origin. See vendor/README.md. -->
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="css/orbis.css">

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js"
  }
}
</script>
</head>
<body>

<canvas id="stage" data-i18n-aria="aria_globe" aria-label="Interactive 3D globe of world economic events"></canvas>

<div id="boot" class="boot">
  <div class="boot-mark"></div>
  <p class="boot-text" data-i18n="boot">Assembling the globe…</p>
  <p class="boot-error" id="boot-error" hidden></p>
</div>

<div id="shell" class="shell" hidden>

  <!-- Thirty-four tab stops separated the keyboard from the event list. This is
       the way past the filters for anyone who did not come to change them. -->
  <a class="skip-link" href="#event-list" data-i18n="skip_to_events">Skip to the event list</a>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <!-- The page had no h1 at all: a screen reader landed on a document
             whose outline started at h2. -->
        <h1 class="brand-name">orbis</h1>
        <span class="brand-tag" data-i18n="tagline">the world economic calendar</span>
      </span>
    </div>

    <div class="topbar-tools">
      <!-- Narrow layouts drop the left rail to keep the globe usable, which
           used to take every filter with it. This brings them back as a panel. -->
      <button type="button" id="filters-toggle" class="filters-toggle"
              aria-expanded="false" aria-controls="rail-left"
              data-i18n-aria="aria_filters" aria-label="Filters">
        <svg viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path d="M3 5.5h12M3 9h12M3 12.5h12" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" fill="none"/>
        </svg>
        <span class="filters-badge" id="filters-badge" hidden></span>
      </button>
      <!-- Every time in the app is UTC, including the event list, so the
           topbar says which clock it is rather than leaving it to be guessed. -->
      <div class="clock" id="clock-box" data-i18n-title="clock_help"
           title="Coordinated Universal Time — every time shown in orbis is UTC">
        <span class="clock-tag">UTC</span>
        <time id="clock" class="clock-value">--:--:--</time>
        <span class="clock-offset" id="clock-offset"></span>
      </div>
      <div class="lang" role="group" data-i18n-aria="aria_lang" aria-label="Language">
        <button type="button" data-lang="en" class="is-active" title="English (US)">
          <svg class="lang-flag" viewBox="0 0 60 40" aria-hidden="true" focusable="false">
            <rect width="60" height="40" fill="#b22234"/>
            <path d="M0 5.4h60M0 16.2h60M0 27h60M0 37.7h60"
                  stroke="#fff" stroke-width="3.1"/>
            <rect width="26" height="21.6" fill="#3c3b6e"/>
            <g fill="#fff">
              <circle cx="4.3" cy="4.3" r="1.3"/><circle cx="13" cy="4.3" r="1.3"/><circle cx="21.7" cy="4.3" r="1.3"/>
              <circle cx="8.7" cy="8.6" r="1.3"/><circle cx="17.3" cy="8.6" r="1.3"/>
              <circle cx="4.3" cy="13" r="1.3"/><circle cx="13" cy="13" r="1.3"/><circle cx="21.7" cy="13" r="1.3"/>
              <circle cx="8.7" cy="17.3" r="1.3"/><circle cx="17.3" cy="17.3" r="1.3"/>
            </g>
          </svg>
          <span>EN</span>
        </button>
        <button type="button" data-lang="pt" title="Português (Brasil)">
          <svg class="lang-flag" viewBox="0 0 60 42" aria-hidden="true" focusable="false">
            <clipPath id="flag-br-disc"><circle cx="30" cy="21" r="9.4"/></clipPath>
            <rect width="60" height="42" fill="#009b3a"/>
            <path d="M30 5 55 21 30 37 5 21Z" fill="#fedf00"/>
            <circle cx="30" cy="21" r="9.4" fill="#002776"/>
            <path d="M20.6 18.3a13 13 0 0 0 18.8 0" fill="none" stroke="#fff" stroke-width="2.6" clip-path="url(#flag-br-disc)"/>
          </svg>
          <span>PT</span>
        </button>
        <button type="button" data-lang="es" title="Español">
          <svg class="lang-flag" viewBox="0 0 60 40" aria-hidden="true" focusable="false">
            <rect width="60" height="40" fill="#aa151b"/>
            <rect y="10" width="60" height="20" fill="#f1bf00"/>
          </svg>
          <span>ES</span>
        </button>
      </div>
    </div>
  </header>

  <aside class="rail rail-left" id="rail-left">

    <section class="card card-next" id="next-card">
      <h2 class="card-title" data-i18n="next_high">Next high-impact release</h2>
      <div class="next-body">
        <div class="next-when">
          <span class="next-countdown" id="next-countdown">--:--:--</span>
          <span class="next-date" id="next-date"></span>
        </div>
        <button type="button" class="next-event" id="next-event">
          <span class="next-flag" id="next-flag"></span>
          <span class="next-labels">
            <span class="next-title" id="next-title">—</span>
            <span class="next-country" id="next-country"></span>
          </span>
        </button>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title" data-i18n="impact">Impact</h2>
      <div class="filter-rows" id="filter-impact"></div>
    </section>

    <section class="card">
      <h2 class="card-title" data-i18n="region">Region</h2>
      <div class="filter-rows" id="filter-region"></div>
    </section>

    <section class="card card-scroll">
      <h2 class="card-title" data-i18n="category">Category</h2>
      <div class="chips" id="filter-category"></div>
    </section>

    <section class="card card-meta">
      <h2 class="card-title" data-i18n="sources">Sources</h2>
      <ul class="source-list" id="source-list"></ul>
      <p class="meta-line" id="generated-line"></p>
    </section>

  </aside>

  <aside class="rail rail-right">
    <header class="panel-head">
      <div>
        <h2 class="panel-title" id="panel-title">—</h2>
        <!-- Filtering changed the count silently for anyone not watching the
             screen. polite waits for a pause rather than interrupting. -->
        <p class="panel-sub" id="panel-sub" aria-live="polite" aria-atomic="true"></p>
      </div>
      <!-- In the header of the list they export, so nothing has to explain
           what "these events" means. Hidden together when the list is empty. -->
      <div class="panel-actions">
        <button type="button" class="panel-pill" id="export-csv" hidden
                data-i18n="export_csv" data-i18n-aria="aria_export_csv"
                aria-label="Download these events as a spreadsheet">csv</button>
        <button type="button" class="panel-pill" id="export-ics" hidden
                data-i18n="export_ics" data-i18n-aria="aria_export_ics"
                aria-label="Download these events as a calendar file">ics</button>
        <button type="button" class="panel-pill" id="panel-reset" hidden data-i18n="clear">clear</button>
      </div>
    </header>
    <div class="panel-body" id="event-list" tabindex="0"></div>
  </aside>

  <footer class="timeline">
    <button type="button" class="tl-step" id="tl-prev" data-i18n-aria="aria_prev_day" aria-label="Previous day">‹</button>
    <div class="tl-track" id="tl-track"></div>
    <button type="button" class="tl-step" id="tl-next" data-i18n-aria="aria_next_day" aria-label="Next day">›</button>
    <button type="button" class="tl-today" id="tl-today" data-i18n="today">today</button>
  </footer>

  <div class="hint" id="hint">
    <span data-i18n="hint">Drag to rotate · scroll to zoom · click a marker · ← → change day</span>
  </div>

</div>

<div id="tooltip" class="tooltip" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
